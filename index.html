<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa SMA Plus AL FALAH AL MAKKY</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-graduation-cap"></i> Data Siswa SMA Plus AL FALAH AL MAKKY</h1>
            <p>Sistem Informasi Manajemen Data Siswa</p>
        </header>

        <div class="action-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari nama atau NISN...">
            </div>
            <button id="btnTambah" class="btn btn-primary">
                <i class="fa-solid fa-user-plus"></i> Tambah Siswa
            </button>
        </div>

        <div class="table-responsive">
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NISN</th>
                        <th>Nama Lengkap</th>
                        <th>Kelas</th>
                        <th>JK</th>
                        <th>No. HP</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data akan dimasukkan secara dinamis via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL TAMBAH / EDIT SISWA -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle">Tambah Data Siswa</h2>
            <form id="studentForm">
                <input type="hidden" id="studentIndex">
                
                <div class="form-group">
                    <label for="nisn">NISN</label>
                    <input type="text" id="nisn" required placeholder="Contoh: 3098472186">
                </div>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Nama lengkap siswa">
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <select id="kelas" required>
                        <option value="">Pilih Kelas</option>
                        <option value="X-A">X-A</option>
                        <option value="X-B">X-B</option>
                        <option value="X-C">X-C</option>
                        <option value="XI-A">XI-A</option>
                        <option value="XI-B">XI-B</option>
                        <option value="XI-C">XI-C</option>
                        <option value="XI-D">XI-D</option>
                        <option value="XI-E">XI-E</option>
                        <option value="XII-B">XII-B</option>
                        <option value="XII-C">XII-C</option>
                        <option value="XII-D">XII-D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jk">Jenis Kelamin</label>
                    <select id="jk" required>
                        <option value="">Pilih Jenis Kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="noHp">No. HP</label>
                    <input type="text" id="noHp" placeholder="Contoh: 085210807140 atau -">
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" rows="3" placeholder="Alamat lengkap siswa"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DETAIL SISWA -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeDetailModal">&times;</span>
            <h2>Detail Siswa</h2>
            <div class="detail-body">
                <p><strong>NISN:</strong> <span id="detailNisn"></span></p>
                <p><strong>Nama Lengkap:</strong> <span id="detailNama"></span></p>
                <p><strong>Kelas:</strong> <span id="detailKelas"></span></p>
                <p><strong>Jenis Kelamin:</strong> <span id="detailJk"></span></p>
                <p><strong>No. HP:</strong> <span id="detailNoHp"></span></p>
                <p><strong>Alamat:</strong> <span id="detailAlamat"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
