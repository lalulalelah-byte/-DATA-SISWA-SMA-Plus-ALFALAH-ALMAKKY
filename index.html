<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa - SMA Plus Al-Falah Al-Makky</title>

    <!-- Framework Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Utama -->
    <header class="header-bg mb-4">
        <div class="container text-center">
            <h1 class="fw-bold mb-1"><i class="fa-solid fa-graduation-cap me-2"></i>SMA PLUS AL-FALAH AL-MAKKY</h1>
            <p class="mb-0 opacity-75">Sistem Direktori Data Siswa Terpadu</p>
        </div>
    </header>

    <div class="container mb-5">

        <!-- RINGKASAN STATISTIK -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat bg-primary text-white p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-uppercase mb-1" style="font-size: 0.8rem;">Total Siswa</h6>
                            <h2 class="fw-bold mb-0" id="stat-total">0</h2>
                        </div>
                        <i class="fa-solid fa-users fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-success text-white p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-uppercase mb-1" style="font-size: 0.8rem;">Laki-laki</h6>
                            <h2 class="fw-bold mb-0" id="stat-lk">0</h2>
                        </div>
                        <i class="fa-solid fa-mars fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat text-white p-3" style="background-color: #d63384;">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-uppercase mb-1" style="font-size: 0.8rem;">Perempuan</h6>
                            <h2 class="fw-bold mb-0" id="stat-pr">0</h2>
                        </div>
                        <i class="fa-solid fa-venus fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL TABEL & PENCARIAN -->
        <div class="table-container">
            
            <!-- Pencarian & Filter -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Cari ID, Nama, NISN, No HP, atau Alamat...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="filterKelas" class="form-select">
                        <option value="">-- Semua Kelas --</option>
                        <option value="X-A">Kelas X-A</option>
                        <option value="X-B">Kelas X-B</option>
                        <option value="X-C">Kelas X-C</option>
                        <option value="XI-A">Kelas XI-A</option>
                        <option value="XI-B">Kelas XI-B</option>
                        <option value="XI-C">Kelas XI-C</option>
                        <option value="XI-D">Kelas XI-D</option>
                        <option value="XI-E">Kelas XI-E</option>
                        <option value="XII-B">Kelas XII-B</option>
                        <option value="XII-C">Kelas XII-C</option>
                        <option value="XII-D">Kelas XII-D</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100" onclick="resetFilter()">
                        <i class="fa-solid fa-rotate-left me-1"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Tabel Data Siswa -->
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center" style="width: 50px;">No</th>
                            <th class="text-center" style="width: 70px;">ID</th>
                            <th>Nama Lengkap</th>
                            <th style="width: 120px;">NISN</th>
                            <th class="text-center" style="width: 90px;">Kelas</th>
                            <th class="text-center" style="width: 130px;">Jenis Kelamin</th>
                            <th style="width: 150px;">No. Telepon / HP</th>
                            <th>Alamat</th>
                        </tr>
                    </thead>
                    <tbody id="siswaTableBody">
                        <!-- Dimuat via script.js -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 text-muted">
                <small id="infoCount">Menampilkan 0 data</small>
            </div>

        </div>
    </div>

    <!-- JavaScript Terpisah -->
    <script src="script.js"></script>
</body>
</html>
